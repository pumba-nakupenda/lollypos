name: LOLLY POS CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
    branches:
      - main

jobs:
  package-checks:
    name: ${{ matrix.package }} checks
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            node-version: 22
            test-command: npm test -- --runInBand src/supabase.service.spec.ts src/products/products.controller.spec.ts src/sales/sales.controller.spec.ts src/expenses/expenses.controller.spec.ts
          - package: luxya-pos
            node-version: 22
            test-command: ""
          - package: lollyshop
            node-version: 22
            test-command: ""

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prepare example env
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi
          if [ -f .env.example ] && [ ! -f .env.local ]; then cp .env.example .env.local; fi

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        continue-on-error: true

      - name: Targeted tests
        if: matrix.test-command != ''
        run: ${{ matrix.test-command }}
